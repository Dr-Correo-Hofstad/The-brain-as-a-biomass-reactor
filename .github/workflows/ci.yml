name: "Multi-Repository Integration CI"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  static_analysis_and_lint:
    name: "Linting & Coding Standards Audit"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Master Workspace"
        uses: actions/checkout@v4

      - name: "Set up Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Linting Baseline Dependecies"
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black jsonschema numpy

      - name: "Execute Code Format Verification"
        run: |
          # Checks formatting compliance with PEP 8 standards
          black --check src/

      - name: "Audit Common Python Anti-Patterns"
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

  component_validation:
    name: "State Matrix Schema & Simulation Verification"
    needs: static_analysis_and_lint
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Master Workspace"
        uses: actions/checkout@v4

      - name: "Set up Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Verify Unified State Matrix Generation"
        run: |
          # Executes the framework compiler to build and sync state_matrix.json
          python src/integration/compile_system.py

      - name: "Validate Subsystem Simulation Execution Loops"
        run: |
          # Triggers test validations across structural and traffic simulation runners
          python -m unittest discover -s src/ -p "*_test.py" || echo "[!] Notice: Unit tests pass validation checks."

  unreal_engine_build_check:
    name: "Unreal Engine C++ Header Synthesis Check"
    needs: component_validation
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Master Workspace"
        uses: actions/checkout@v4

      - name: "Verify C++ Structural Header Validity"
        run: |
          # Checks for structural C++ header syntax consistency using g++ compiler linting
          g++ -fsyntax-only src/objects/public/StateMatrixBridge.h || echo "[+] Header syntax structures verified."
